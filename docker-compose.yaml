services:
  backend-app:
    build: ./backend_fastapi
    container_name: backend-app-1
    image: catherinehsu39/sdc-main-branch-backend:latest
    expose:
      - "8000"
    restart: always
    networks:
      - intranet

  frontend-vue:
    build: ./frontend_vue
    container_name: frontend-vue
    image: catherinehsu39/sdc-main-branch-frontend:latest
    ports:
      - "80:80"  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend-app
    networks:
      - intranet

networks:
  intranet:
    driver: bridge

volumes:
  mariadb_data: